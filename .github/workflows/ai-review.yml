name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

# Queue rather than cancel: a cancelled review can leave inline comments without a summary.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: claude review
    # Secrets are not available to fork PRs; Dependabot bumps are covered by CI.
    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check credentials
        id: auth
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$API_KEY$OAUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AI review skipped: set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.auth.outputs.ok == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        if: steps.auth.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to txoutbox. The PR branch is checked out in the working
            directory; read CLAUDE.md first, it lists the invariants. Get the diff with
            `gh pr diff`, and read the surrounding code, not just the hunks.

            Look for, in this order:
            1. Correctness: broken fencing, lost or double-counted attempts, per-key reordering,
               lease overruns, races between concurrent workers, SQL that misbehaves under
               concurrency or on NULLs, clock and timezone mistakes.
            2. asyncio: swallowed CancelledError, tasks that leak or are never awaited,
               blocking calls on the event loop, shutdown paths that hang.
            3. Public API and compatibility: changes to the Storage protocol, defaults or
               schema without a CHANGELOG entry and upgrade note.
            4. Tests: a fix without a regression test that would fail without it.

            Ruff and mypy --strict already run in CI: do not comment on style, formatting,
            naming or typing they would catch. Do not praise, do not restate the diff.
            Report only issues you can back with a concrete failing scenario (inputs, state,
            interleaving -> wrong result). If unsure, say so explicitly or leave it out.

            Earlier runs may already have commented. List existing review comments with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
            and do not post an issue that is already raised there; mention in the summary
            which earlier issues the new commits resolved.

            Post each new issue as an inline comment with
            `mcp__github_inline_comment__create_inline_comment` (confirmed: true), giving the
            scenario and a suggested fix. Then post one summary comment, replacing the
            previous one: `gh pr comment <PR NUMBER> --edit-last --create-if-none --body-file -`.
            Start it with "AI review:" and either the number of issues by severity or
            "no issues found". Only post GitHub comments; do not reply with text.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Read,Grep,Glob"
