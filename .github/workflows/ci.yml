name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDEVMODE: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked --group dev --group examples --extra postgres
      - name: Ruff check
        run: uv run ruff check --output-format=github src tests examples
      - name: Ruff format
        run: uv run ruff format --check src tests examples
      - name: Mypy
        run: uv run mypy src
      - name: Lint workflows
        run: uvx --from actionlint-py==1.7.12.25 actionlint
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --format=github .github/workflows

  test:
    name: test (py${{ matrix.python-version }}, pg${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        postgres: ["17"]
        include:
          - python-version: "3.11"
            postgres: "14"
          - python-version: "3.14"
            postgres: "18"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: txoutbox
          POSTGRES_PASSWORD: txoutbox
          POSTGRES_DB: txoutbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U txoutbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TXOUTBOX_PG_DSN: postgresql://txoutbox:txoutbox@localhost:5432/txoutbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --group dev --group examples --extra postgres
      - name: Test
        id: test
        run: >-
          uv run pytest -q --timeout=120 -p no:cacheprovider -W error::RuntimeWarning
          --cov --cov-report=term --cov-fail-under=93
      - name: Coverage summary
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: uv run --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  lowest:
    name: test (lowest direct deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: txoutbox
          POSTGRES_PASSWORD: txoutbox
          POSTGRES_DB: txoutbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U txoutbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TXOUTBOX_PG_DSN: postgresql://txoutbox:txoutbox@localhost:5432/txoutbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Install with the oldest allowed versions
        run: |
          uv sync --resolution lowest-direct --group dev --extra postgres
          # The dev group pins a newer asyncpg; test the floor the postgres extra promises.
          floor=$(uv run --no-sync python - <<'PY'
          import re, tomllib
          extra = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]
          (spec,) = [d for d in extra["postgres"] if re.match(r"asyncpg\b", d)]
          match = re.search(r">=\s*([0-9][0-9.]*)", spec)
          assert match, f"no >= floor in {spec!r}"
          print(match.group(1))
          PY
          )
          uv pip install "asyncpg==$floor"
          uv pip list
      - name: Test
        run: uv run --no-sync pytest -q --timeout=120 -p no:cacheprovider

  platforms:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --group dev --extra postgres
      # No Postgres service on these runners: the Postgres suite skips, the rest runs.
      - name: Test
        run: uv run pytest -q --timeout=120 -p no:cacheprovider

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine@7.0.0 check --strict dist/*
      - name: Check sdist contents
        run: |
          tar -tzf dist/*.tar.gz | sed 's|^[^/]*/||' | sort > sdist.txt
          for f in src/txoutbox/py.typed tests/test_relay.py LICENSE CHANGELOG.md; do
            grep -qx "$f" sdist.txt || { echo "::error::sdist is missing $f"; exit 1; }
          done
          if grep -E '^(\.github/|CLAUDE\.md|uv\.lock)' sdist.txt; then
            echo "::error::sdist contains repository-only files"; exit 1
          fi
      - name: Test the installed wheel
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --python 3.12 \
            --with "${wheel}[postgres]" --with pytest --with pytest-asyncio --with pytest-timeout \
            python -c "import txoutbox, sys; assert 'site-packages' in txoutbox.__file__, txoutbox.__file__; print(txoutbox.__version__)"
          uv run --isolated --no-project --python 3.12 \
            --with "${wheel}[postgres]" --with pytest --with pytest-asyncio --with pytest-timeout \
            pytest -q --timeout=120 -p no:cacheprovider tests

  ok:
    name: ci ok
    if: always()
    needs: [lint, test, lowest, platforms, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
